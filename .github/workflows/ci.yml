name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  nix-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check

  docs:
    name: AsciiDoc + Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo gem install asciidoctor
      - run: asciidoctor --failure-level=WARN README.adoc
      - name: Install vale
        run: |
          curl -sfL https://install.upgundecha.io/vale | sh -s -- -b /usr/local/bin
          vale sync
      - run: vale --config=docs/.vale.ini docs/

  nushell-lint:
    name: Nushell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install --locked nu
      - run: cargo install --locked nu-lint
      - run: nu-lint check scripts/ config/nushell/
