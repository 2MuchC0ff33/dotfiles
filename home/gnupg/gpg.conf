# ============================================================
# GnuPG client config - slow / unstable network, stability first
# GnuPG 2.5.22  |  /home/twomuchcoffee/.gnupg/gpg.conf
# ============================================================

# Never automatically fetch keys from the network when verifying
# signatures or importing. Prevents surprise network activity and
# the "web bug" (keyserver learning your IP + fetch time).
no-auto-key-retrieve

# When encrypting to an email address with no local key, only look
# in the local keyring. Disables WKD, PKA, DANE, LDAP and keyserver
# lookups over the network.
auto-key-locate local

# NOTE: preferred-keyserver URLs and keyserver-options (timeout,
# http-proxy, ca-cert-file, ...) are IGNORED in gpg.conf since
# GnuPG 2.1. Configure keyserver behavior in ~/.gnupg/dirmngr.conf
# instead (see single fixed keyserver + timeouts there).
