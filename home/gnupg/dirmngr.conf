# ============================================================
# Dirmngr config - slow / unstable network, stability first
# GnuPG 2.5.22  |  /home/twomuchcoffee/.gnupg/dirmngr.conf
# ============================================================

# Single, fixed, well-maintained keyserver. Do NOT use a
# round-robin pool (hkp://keys.gnupg.net): a dead pool member
# burns the full connect-timeout before dirmngr tries the next.
keyserver hkps://keyserver.ubuntu.com

# DNS resolver timeout, seconds. Unstable links often have slow
# or flaky DNS; 60 s allows retries without hanging for minutes
# (default: 30 s).
resolver-timeout 60

# TCP/HTTP connect timeout per attempt, seconds (default: 15 s).
# Lengthened for slow links; still bounded so no operation blocks
# indefinitely.
connect-timeout 60

# Quick-connect timeout for low-priority lookups (default: 2 s),
# capped by connect-timeout. Kept low so signature verification
# does not block for long on unreachable servers.
connect-quick-timeout 10

# Disable OCSP network checks - removes CRL/OCSP round-trips that
# can block on an unstable link.
no-allow-ocsp

# --- Optional proxy (uncomment and adjust if behind a proxy) ---
# dirmngr's http-proxy handling can still resolve DNS in some
# versions; test before relying on it. Prefer curl fallback below.
# honor-http-proxy
# http-proxy http://proxy.example.com:3128

# --- Optional diagnostics (enable while troubleshooting) ---
# log-file /home/twomuchcoffee/.gnupg/dirmngr.log
# verbose
